<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぴったり つくろう！ テープ図</title>
<style>
:root{--ink:#24304a;--coral:#e95959;--blue:#acdcec;--peach:#ffe5bd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDPGothic","Yu Gothic",sans-serif;color:var(--ink);background:#dff3f7}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #186d9e;outline-offset:2px}
.app{min-height:100dvh;padding:8px;background:radial-gradient(circle at 5% 10%,#fff1aa 0 8%,transparent 8.4%),radial-gradient(circle at 95% 90%,#bdebd2 0 10%,transparent 10.4%),#dff3f7}
.card{width:min(1180px,100%);min-height:calc(100dvh - 16px);margin:auto;padding:10px 15px 14px;border:3px solid white;border-radius:24px;background:#fffdf7}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.badge{display:grid;width:50px;height:50px;place-items:center;border-radius:15px;background:var(--coral);color:white;font-size:2rem;font-weight:900;box-shadow:0 5px 0 #c94444;transform:rotate(-4deg)}
.brand small{display:block;color:#627084;font-weight:800;letter-spacing:.1em}.brand h1{margin:-2px 0 0;font-size:clamp(1.35rem,3vw,2.05rem)}.actions{display:flex;gap:7px;align-items:center}.util,.sound{min-height:42px;border:2px solid #aebbc3;border-radius:12px;background:#fff;color:#33425a;font-weight:800}.util{padding:6px 12px}.sound{width:44px}
.screen{margin-top:12px}.hidden{display:none!important}.settings{max-width:760px;margin:clamp(12px,4vh,48px) auto 0;padding:clamp(18px,3vw,30px);border:3px solid #83cfea;border-radius:22px;background:#f2fbff}.settings h2{margin:0 0 12px;color:#26799b}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 22px}.settings label{display:grid;gap:6px;font-weight:900}.settings select,.settings input{width:100%;min-height:49px;padding:6px 12px;border:2px solid #93b5c5;border-radius:11px;background:white;color:#24304a;font-size:1.07rem}.settings .hint{font-size:.83rem;color:#60758a;font-weight:600}.settings .wide{grid-column:1/-1}.settings .foot{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.primary{min-height:52px;padding:9px 25px;border:0;border-radius:15px;background:var(--coral);color:white;font-size:1.16rem;font-weight:900;box-shadow:0 5px 0 #c94444}.secondary{min-height:44px;padding:6px 16px;border:2px solid #8baebe;border-radius:12px;background:white;color:#245974;font-weight:800}.error{color:#bb3434;min-height:1.4em;font-weight:800}
.status{display:flex;min-height:38px;margin:7px 0;padding:4px 10px;align-items:center;justify-content:center;gap:clamp(12px,3vw,40px);border-radius:11px;background:#edf4f5;font-size:.84rem;font-weight:800}.status b{color:#176e98}
.play{display:grid;min-height:calc(100dvh - 151px);grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:13px}.problem,.numbers{position:relative;display:flex;min-width:0;min-height:0;border-radius:21px;flex-direction:column;align-items:center;justify-content:center}.problem{padding:65px 16px 23px;border:3px solid #83cfea;background:linear-gradient(145deg,#f4fcff,#e3f7ff);overflow:hidden}.numbers{padding:12px;border:3px solid #ffd05c;background:#fff8da}.round{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:6px}.count{padding:5px 12px;border-radius:999px;background:white;color:#277ea7;font-weight:900}.timer{font-size:clamp(1rem,2.3vw,1.45rem);font-weight:900}.progress{position:absolute;top:53px;left:20px;right:20px;height:7px;border-radius:999px;background:#cce9f3;overflow:hidden}.progress i{display:block;height:100%;background:#4fbc75;transition:width .25s}
.equation{display:flex;width:100%;align-items:center;justify-content:center;gap:clamp(7px,1.1vw,14px);font-size:clamp(2.5rem,5.1vw,4.7rem);font-weight:900;line-height:1;white-space:nowrap}.box{display:grid;width:1.52em;height:1.14em;flex:0 0 1.52em;place-items:center;border:5px solid var(--coral);border-radius:.22em;background:white;font-size:.9em}.box.filled{background:#fff2ae}
.tape{width:min(460px,95%);margin:clamp(18px,3vh,30px) auto 0;font-weight:900;text-align:center}.total-label{font-size:1.35rem}.total-caption{margin-left:8px;color:#60758a;font-size:.77rem}.bracket{width:100%;height:13px;margin-top:3px;border:2px solid #364d6c;border-bottom:0;border-radius:8px 8px 0 0}.tape-bar{display:flex;width:100%;height:clamp(55px,10vh,88px);border:3px solid #364d6c;background:white;overflow:hidden}.tape-part{position:relative;display:flex;min-width:0}.tape-part+.tape-part{border-left:3px solid #364d6c}.tape-part.left{background:var(--blue)}.tape-part.right{background:var(--peach)}.unit{flex:1;min-width:0}.boundaries .unit:not(:last-of-type){border-right:1px solid #70849a}.part-label{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:clamp(1.3rem,3vw,1.9rem);text-shadow:0 1px white,1px 0 white,-1px 0 white}.part-label.unknown{color:#c3463c}.tape-part.solved{background:#d4f2d9}
.feedback{min-height:1.5em;margin:20px 0 0;color:#517084;font-size:1.1rem;font-weight:900;text-align:center}.feedback.good{color:#219554;font-size:1.3rem}.feedback.bad{color:#d84444;font-size:1.3rem}.numbers>p{margin:0 0 9px;font-weight:900}.grid{display:grid;width:100%;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,.9vw,10px)}.grid button{min-height:clamp(48px,8.2vh,68px);border:3px solid white;border-radius:15px;color:#22324b;font-size:clamp(1.35rem,3vw,2.3rem);font-weight:900;box-shadow:0 5px 0 #534b2033}.grid button:disabled{opacity:.5}
.correct-mark{position:absolute;z-index:5;top:52%;left:50%;width:min(55%,260px);aspect-ratio:1;border:clamp(15px,3vw,26px) solid #e42129;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.35)}.correct-mark.show{animation:mark 1.15s ease-out forwards}@keyframes mark{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}18%{opacity:.96;transform:translate(-50%,-50%) scale(1.04)}70%{opacity:.96;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
.result{max-width:680px;margin:clamp(35px,9vh,110px) auto;text-align:center}.result h2{font-size:clamp(1.7rem,4vw,2.8rem);color:#20825b}.result strong{display:block;color:var(--coral);font-size:clamp(2.8rem,6vw,5rem)}.result .result-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}
.records{max-width:850px;margin:16px auto;padding:20px;border:3px solid #b2d8e8;border-radius:20px;background:#f5fbff}.records h2{margin:0;color:#206384}.record-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.record-note{font-size:.83rem;color:#60758a}.profiles{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.profiles button{padding:8px 14px;border:2px solid #93a6b1;border-radius:100px;background:white;font-weight:800}.profiles button.active{border-color:#208ab8;background:#dff5ff}.chart-wrap{overflow-x:auto;margin:15px 0;border:1px solid #d3e5ed;border-radius:12px;background:white}.chart-wrap svg{display:block;height:240px}.record-table{width:100%;border-collapse:collapse;text-align:center}.record-table th,.record-table td{padding:8px;border-bottom:1px solid #d9e6e9}.record-table th{background:#e5f5fa}.empty{padding:28px;text-align:center;color:#6b7f8c}
@media(min-width:700px) and (max-height:850px){.app{padding:4px}.card{min-height:calc(100dvh - 8px);padding:6px 11px 9px}.badge{width:40px;height:40px;font-size:1.45rem}.brand small{font-size:.6rem}.brand h1{font-size:1.4rem}.util,.sound{min-height:34px}.util{padding:3px 10px;font-size:.76rem}.status{min-height:32px;margin:4px 0;font-size:.7rem}.play{min-height:calc(100dvh - 110px);gap:9px}.problem{padding:58px 10px 10px}.numbers{padding:9px}.round{top:8px}.progress{top:41px;height:6px}.grid{gap:6px}.grid button{min-height:clamp(42px,7.4vh,58px);border-radius:12px}.tape{margin-top:12px}.tape-bar{height:clamp(44px,9vh,68px)}.feedback{margin:10px 0 0}}
@media(max-width:699px){.card{padding:10px}.top{flex-wrap:wrap}.brand small{display:none}.actions{margin-left:auto}.play{grid-template-columns:1fr;min-height:auto}.problem{min-height:330px;padding-top:67px}.numbers{min-height:260px}.settings-grid{grid-template-columns:1fr}.settings .wide{grid-column:auto}.grid button{min-height:51px}.status{flex-wrap:wrap}.tape-bar{height:55px}.record-table{font-size:.81rem}}
</style>
</head>
<body><main class="app"><section class="card">
<header class="top"><div class="brand"><span class="badge">＋</span><div><small>ほすう タイムゲーム</small><h1>ぴったり つくろう！</h1></div></div><div class="actions"><button type="button" id="settingsBtn" class="util hidden">⚙ 設定に戻る</button><button type="button" id="recordsBtn" class="util">📈 きろく</button><button type="button" id="soundBtn" class="sound" aria-label="音を消す">🔊</button></div></header>
<section id="settingsScreen" class="screen settings"><h2>はじめる前の設定</h2><div class="settings-grid">
<label class="wide">ニックネーム<input id="nickname" type="text" maxlength="12" autocomplete="off" placeholder="名前を入力してね"><span class="hint">「teacher」と入力すると、この端末のみんなの記録を見られます。</span></label>
<label>合計の数<select id="targetSelect"></select></label>
<label>□の場所<select id="blankPosition"><option value="right">右のみ</option><option value="left">左のみ</option><option value="random">左右ランダム</option></select></label>
<label>テープ図の境界線<select id="boundaries"><option value="on">あり（1ずつ区切る）</option><option value="off">なし</option></select></label>
</div><div class="foot"><button type="button" id="startBtn" class="primary">設定して10問スタート</button><button type="button" id="settingsRecords" class="secondary">きろくを見る</button></div><p id="nameError" class="error" role="alert"></p></section>
<section id="gameScreen" class="screen hidden"><div class="status"><b id="playerStatus"></b><span id="targetStatus"></span><span id="bestStatus"></span></div><div class="play">
<section id="problem" class="problem"><div class="round"><span id="count" class="count"></span><span id="timer" class="timer"></span></div><div class="progress"><i id="progressBar"></i></div>
<div class="equation"><span id="leftOperand"></span><span>＋</span><span id="rightOperand"></span><span>＝</span><span id="total"></span></div>
<div id="tape" class="tape" role="img"><div><span id="tapeTotal" class="total-label"></span><span class="total-caption">ぜんぶ</span></div><div class="bracket"></div><div class="tape-bar"><div id="leftPart" class="tape-part left"></div><div id="rightPart" class="tape-part right"></div></div></div>
<p id="feedback" class="feedback" aria-live="polite"></p><div id="correctMark" class="correct-mark" aria-hidden="true"></div></section>
<section class="numbers"><p>□に はいる 数は？</p><div id="grid" class="grid"></div></section></div></section>
<section id="resultScreen" class="screen result hidden"><h2>10もん おわり！</h2><p><strong id="resultAccuracy"></strong><span id="resultDetail"></span></p><p id="resultTime"></p><p id="saveStatus"></p><div class="result-actions"><button type="button" id="againBtn" class="primary">もう10問</button><button type="button" id="resultRecords" class="secondary">きろくを見る</button><button type="button" id="resultSettings" class="secondary">設定に戻る</button></div></section>
<section id="recordsScreen" class="screen records hidden"><div class="record-header"><h2 id="recordsTitle"></h2><button type="button" id="closeRecords" class="secondary">もどる</button></div><p class="record-note">正答率は10問のうち、1回目で正解した割合です。記録はこのタブレットのこのブラウザに保存されます。</p><div id="profiles" class="profiles"></div><div id="recordsContent"></div></section>
</section></main>
<script>
"use strict";
const STORE="make-total-time-game-players-v1", SEL="make-total-time-game-selected-v1", SETTINGS="make-total-time-game-settings-v2";
const COLORS=["#f6b9bd","#f6d59b","#f4e99b","#b9df9f","#96d8c7","#91d4ea","#9dbce7","#b8a8e6","#dfb1d7","#f6b9bd"];
const $=id=>document.getElementById(id);
let players=[],selectedId="",target=10,blankMode="right",boundaryOn=true,questions=[],index=0,firstTry=0,mistakes=0,hadError=false,locked=false,entered=null,screen="settings",recordOrigin="settings",teacherProfile="",soundOn=true,audio=null,startAt=0,elapsed=0,timerId=null,pendingId=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(players));localStorage.setItem(SEL,selectedId);localStorage.setItem(SETTINGS,JSON.stringify({target,blankMode,boundaryOn}))}catch{return false}return true}
function selected(){return players.find(p=>p.id===selectedId)||null}
function fmt(n){return Number(n).toFixed(2)+"秒"}
function best(){const records=selected()?.records||[];const times=records.filter(r=>r.target===target).map(r=>Number(r.time)).filter(Number.isFinite);return times.length?Math.min(...times):null}
function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C||!soundOn)return null;if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();return audio}
function note(f,time,len,type="sine",volume=.12){const c=audioCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(volume,time+.012);g.gain.exponentialRampToValueAtTime(.0001,time+len);o.connect(g).connect(c.destination);o.start(time);o.stop(time+len+.02)}
function correctSound(){const c=audioCtx();if(c){note(523,c.currentTime,.15);note(659,c.currentTime+.11,.17);note(784,c.currentTime+.23,.32)}}
function wrongSound(){const c=audioCtx();if(c){note(160,c.currentTime,.2,"triangle",.09);note(125,c.currentTime+.09,.22,"triangle",.08)}}
function show(which){screen=which;for(const name of ["settings","game","result","records"])$(name+"Screen").classList.toggle("hidden",name!==which);$("settingsBtn").classList.toggle("hidden",which==="settings"||which==="records")}
function stop(){clearInterval(timerId);timerId=null;clearTimeout(pendingId);pendingId=null;if(screen==="game")elapsed=(performance.now()-startAt)/1000;$("correctMark").classList.remove("show")}
function toSettings(){stop();show("settings");$("nameError").textContent="";$("nickname").value=selected()?.name||$("nickname").value}
function parseName(){const name=$("nickname").value.trim().slice(0,12);if(!name){$("nameError").textContent="ニックネームを入力してね。";$("nickname").focus();return null}$("nameError").textContent="";return name}
function readSettings(){target=Number($("targetSelect").value);blankMode=$("blankPosition").value;boundaryOn=$("boundaries").value==="on"}
function choosePlayer(name){let p=players.find(p=>p.name===name);if(!p){p={id:Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),name,records:[]};players.push(p)}selectedId=p.id;save();return p}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuestions(){const values=shuffle(Array.from({length:target-1},(_,i)=>i+1));const list=Array.from({length:10},(_,i)=>values[i%values.length]);if(target<11){for(let i=1;i<list.length;i++)if(list[i]===list[i-1]){const j=(i+1)%list.length;[list[i],list[j]]=[list[j],list[i]]}}return list.map(left=>({left,right:target-left,blank:blankMode==="random"?(Math.random()<.5?"left":"right"):blankMode}))}
function begin(){const name=parseName();if(!name)return;readSettings();if(name.toLowerCase()==="teacher"){openRecords(true);return}choosePlayer(name);questions=makeQuestions();index=0;firstTry=0;mistakes=0;hadError=false;locked=false;entered=null;elapsed=0;clearTimeout(pendingId);show("game");startAt=performance.now();clearInterval(timerId);timerId=setInterval(()=>{$("timer").textContent="⏱ "+fmt((performance.now()-startAt)/1000)},80);renderQuestion()}
function part(el,n,display){el.style.flex=String(n);el.replaceChildren();for(let i=0;i<n;i++){const unit=document.createElement("span");unit.className="unit";el.appendChild(unit)}const label=document.createElement("span");label.className="part-label"+(display==="□"?" unknown":"");label.textContent=display;el.appendChild(label)}
function renderQuestion(){const q=questions[index],leftBlank=q.blank==="left",correct=locked;const shownLeft=leftBlank?(correct?q.left:entered??""):q.left,shownRight=leftBlank?q.right:(correct?q.right:entered??"");$("leftOperand").textContent=shownLeft;$("rightOperand").textContent=shownRight;
for(const [el,blank,value] of [[$("leftOperand"),leftBlank,shownLeft],[$("rightOperand"),!leftBlank,shownRight]]){el.className=blank?"box"+(value!==""?" filled":""):""}
$("total").textContent=target;$("tapeTotal").textContent=target;part($("leftPart"),q.left,leftBlank?(correct?q.left:"□"):q.left);part($("rightPart"),q.right,!leftBlank?(correct?q.right:"□"):q.right);$("leftPart").classList.toggle("solved",leftBlank&&correct);$("rightPart").classList.toggle("solved",!leftBlank&&correct);$("tape").classList.toggle("boundaries",boundaryOn);$("tape").setAttribute("aria-label",`テープ図。全部で${target}。左${leftBlank&&!correct?"しかく":q.left}、右${!leftBlank&&!correct?"しかく":q.right}。境界線${boundaryOn?"あり":"なし"}。`);
$("count").textContent=`${index+1} / 10 もん`;$("progressBar").style.width=(index*10)+"%";$("timer").textContent="⏱ "+fmt((performance.now()-startAt)/1000);$("playerStatus").textContent="なまえ："+selected().name;$("targetStatus").textContent="合計 "+target;$("bestStatus").textContent="ベスト："+(best()===null?"―":fmt(best()));$("feedback").textContent="こたえを タッチ";$("feedback").className="feedback";
const grid=$("grid");grid.replaceChildren();for(let n=1;n<target;n++){const b=document.createElement("button");b.type="button";b.textContent=n;b.style.background=COLORS[(n-1)%COLORS.length];b.disabled=locked;b.onclick=()=>answer(n);grid.appendChild(b)}}
function answer(n){if(screen!=="game"||locked)return;const q=questions[index],value=q.blank==="left"?q.left:q.right;entered=n;if(n!==value){hadError=true;mistakes++;wrongSound();renderQuestion();$("feedback").textContent="もう一度！";$("feedback").className="feedback bad";return}
if(!hadError)firstTry++;locked=true;correctSound();renderQuestion();$("feedback").textContent="せいかい！";$("feedback").className="feedback good";$("grid").querySelectorAll("button").forEach(b=>b.disabled=true);const mark=$("correctMark");mark.classList.remove("show");void mark.offsetWidth;mark.classList.add("show");pendingId=setTimeout(()=>{if(screen!=="game")return;if(index===9){finish();return}index++;entered=null;locked=false;hadError=false;mark.classList.remove("show");renderQuestion()},1150)}
function finish(){elapsed=(performance.now()-startAt)/1000;clearInterval(timerId);timerId=null;$("progressBar").style.width="100%";const p=selected();p.records.push({target,time:elapsed,mistakes,firstTry,correct:firstTry,total:10,date:new Date().toISOString(),blankMode,boundaryOn});const ok=save();$("resultAccuracy").textContent="正答率 "+(firstTry*10)+"％";$("resultDetail").textContent="（1回目で正解 "+firstTry+" / 10問）";$("resultTime").textContent="タイム "+fmt(elapsed)+"　まちがい "+mistakes+"回";$("saveStatus").textContent=ok?"学習記録を保存しました。":"学習記録を保存できませんでした。";show("result")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function openRecords(forceTeacher=false){recordOrigin=screen;if(screen==="game")stop();const input=$("nickname").value.trim();const teacher=forceTeacher||input.toLowerCase()==="teacher";const name=teacher?"teacher":screen==="settings"?input||selected()?.name:selected()?.name;if(!name){$("nameError").textContent="ニックネームを入力してね。";return}show("records");$("recordsTitle").textContent=teacher?"指導者用：みんなの学習記録":name+" さんの学習記録";renderRecords(teacher,name)}
function graph(rows){const known=rows.map((r,i)=>({...r,n:i+1})).filter(r=>Number.isInteger(r.firstTry)||Number.isInteger(r.correct));if(!known.length)return '<p class="empty">正答率のグラフは、今回以降の記録から表示されます。</p>';const w=Math.max(420,known.length*65+90),left=45,right=w-28,top=18,bottom=190;const x=n=>left+(n-1)*((right-left)/Math.max(1,rows.length-1)),y=p=>bottom-(p/100)*(bottom-top);const grid=[0,50,100].map(v=>`<line x1="${left}" y1="${y(v)}" x2="${right}" y2="${y(v)}" stroke="#d9e6ed"/><text x="5" y="${y(v)+5}" font-size="12" fill="#526c80">${v}％</text>`).join("");const points=known.map(r=>{const pct=(r.firstTry??r.correct)*10;return `<circle cx="${x(r.n)}" cy="${y(pct)}" r="6" fill="#e95959"/><text x="${x(r.n)}" y="${y(pct)-12}" text-anchor="middle" font-size="13" fill="#a74444">${pct}％</text><text x="${x(r.n)}" y="218" text-anchor="middle" font-size="12" fill="#526c80">${r.n}回目</text>`}).join("");return `<div class="chart-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="240" viewBox="0 0 ${w} 240" role="img" aria-label="学習回ごとの正答率">${grid}${points}</svg></div>`}
function renderRecords(teacher,name){const profiles=$("profiles");profiles.replaceChildren();const names=players.filter(p=>p.name.toLowerCase()!=="teacher").map(p=>p.name);if(teacher){if(!names.includes(teacherProfile))teacherProfile=names[0]||"";for(const n of names){const b=document.createElement("button");b.type="button";b.textContent=n;b.className=n===teacherProfile?"active":"";b.onclick=()=>{teacherProfile=n;renderRecords(true,"teacher")};profiles.appendChild(b)}name=teacherProfile}
const p=players.find(p=>p.name===name),records=p?.records||[];if(!records.length){$("recordsContent").innerHTML='<p class="empty">まだ記録がありません。</p>';return}
const table=records.map((r,i)=>{const date=new Date(r.date).toLocaleDateString("ja-JP"),n=r.firstTry??r.correct,pct=Number.isInteger(n)?n*10+"％":"―";return `<tr><td>${i+1}回目</td><td>${esc(date)}</td><td>${r.target??"―"}</td><td>${pct}</td><td>${fmt(r.time)}</td></tr>`}).join("");$("recordsContent").innerHTML=`<h3>${esc(name)} さん：${records.length}回の記録</h3>${graph(records)}<div style="overflow-x:auto"><table class="record-table"><thead><tr><th>何回目</th><th>日付</th><th>合計</th><th>正答率</th><th>タイム</th></tr></thead><tbody>${table}</tbody></table></div>`}
function closeRecords(){if(recordOrigin==="game"){show("settings")}else show(recordOrigin)}
function load(){try{const saved=JSON.parse(localStorage.getItem(STORE)||"[]");players=Array.isArray(saved)?saved.filter(p=>p&&typeof p.name==="string"&&Array.isArray(p.records)):[];selectedId=localStorage.getItem(SEL)||"";const st=JSON.parse(localStorage.getItem(SETTINGS)||"{}");target=Number.isInteger(st.target)&&st.target>=5&&st.target<=20?st.target:10;blankMode=["left","right","random"].includes(st.blankMode)?st.blankMode:"right";boundaryOn=st.boundaryOn!==false}catch{players=[];selectedId=""}
for(let n=5;n<=20;n++){const o=document.createElement("option");o.value=n;o.textContent=n;$("targetSelect").appendChild(o)}$("targetSelect").value=target;$("blankPosition").value=blankMode;$("boundaries").value=boundaryOn?"on":"off";$("nickname").value=selected()?.name||"";show("settings")}
$("startBtn").onclick=begin;$("againBtn").onclick=begin;$("settingsBtn").onclick=toSettings;$("resultSettings").onclick=toSettings;$("recordsBtn").onclick=()=>openRecords();$("settingsRecords").onclick=()=>openRecords();$("resultRecords").onclick=()=>openRecords();$("closeRecords").onclick=closeRecords;$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent=soundOn?"🔊":"🔇";$("soundBtn").setAttribute("aria-label",soundOn?"音を消す":"音を出す")};$("nickname").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();begin()}};$("nickname").oninput=()=>$("nameError").textContent="";load();
</script></body></html>
